# configs/base.yaml
seed: 42

paths:
  raw_csv: "data/raw/loan.csv"
  processed_pd_dir: "data/processed/pd"
  output_format: "parquet"  # Puedes cambiarlo a "parquet" si prefieres menor peso en Git

# Fechas para la partición temporal (Out-of-Time)
temporal_split:
  train_end: "2014-06-01"   # Todo hasta junio 2014 -> Entrenamiento
  val_end: "2014-12-01"     # Julio 2014 a Dic 2014 -> Validación (Early stopping / Hiperparámetros)
                            # Enero 2015 en adelante -> Test Out-of-Time

# Variables estrictamente disponibles en el momento de la solicitud (Originación)
features_pd:
  numeric:
    - loan_amnt # Monto del préstamo
    - int_rate # Tasa de interés
    - installment # Cuota mensual
    - annual_inc # Ingreso anual
    - dti # Relación deuda-ingreso
    - delinq_2yrs # Número de veces que el prestatario ha estado en mora en los últimos 2 años
    - inq_last_6mths # Número de consultas de crédito en los últimos 6 meses
    - open_acc # Número de cuentas abiertas en el historial de crédito
    - pub_rec # Número de registros públicos negativos (como quiebras) en el historial de crédito
    - revol_bal # Balance de la línea de crédito rotativa
    - revol_util # Porcentaje de la línea de crédito rotativa que se está utilizando
    - total_acc # Número total de cuentas en el historial de crédito
    #-----------------------------------------
    #           Variables derivadas
    #-----------------------------------------
    - credit_history_months  # Calculada como (issue_d - earliest_cr_line)
    - has_prev_delinq        # Bandera 1/0 creada a partir de mths_since_last_delinq
  categorical_ordinal:
    - term                   # "36 months" -> 36, "60 months" -> 60
    - emp_length             # "< 1 year" -> 0 ... "10+ years" -> 10
    - grade                  # "A" -> 1 ... "G" -> 7
  categorical_nominal:
    - home_ownership         # RENT, MORTGAGE, OWN, OTHER
    - verification_status    # Verified, Source Verified, Not Verified
    - purpose                # debt_consolidation, credit_card, small_business, etc.